
name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt
      - name: Lint
        run: ruff check . || true
      - name: Tests
        run: pytest -q
      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t ghcr.io/${{ github.repository }}:sha-${{ github.sha }} .
