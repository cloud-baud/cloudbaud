
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - VECTOR_STORE=in_memory
    depends_on: [qdrant, mlflow]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    command: mlflow ui --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
